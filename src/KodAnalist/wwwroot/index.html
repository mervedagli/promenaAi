<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promena Rehberi</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <script>
    // Tema (Sistem / Açık / Koyu): sayfa çizilmeden önce uygulanır ki açılışta renk sıçraması olmasın.
    try {
      const t = localStorage.getItem("kodAnalistTheme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch { /* depolama kapalıysa sistem teması kullanılır */ }
  </script>
  <!-- Cevap biçimlendirme kütüphaneleri uygulamayla birlikte gelir (internet / CDN erişimi gerekmez). -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
      --border: #e3e6eb; --accent: #2f5bd3; --accent-text: #ffffff;
      --code-bg: #f1f3f6; --error: #b42318; --error-bg: #fef3f2;
      --ok: #067647; --warn: #b54708;
      color-scheme: light;
    }
    /* Koyu tema: "Sistem" seçiliyken işletim sisteminin ayarına uyar, "Koyu" seçiliyken her zaman uygulanır. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #98a2b3;
        --border: #2c323c; --accent: #6b8ff0; --accent-text: #0d1117;
        --code-bg: #252a33; --error: #fda29b; --error-bg: #3a1a17;
        --ok: #75e0a7; --warn: #fdb022;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #98a2b3;
      --border: #2c323c; --accent: #6b8ff0; --accent-text: #0d1117;
      --code-bg: #252a33; --error: #fda29b; --error-bg: #3a1a17;
      --ok: #75e0a7; --warn: #fdb022;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    /* "Rehberi" yazısı, logodaki "Promena" yazısıyla aynı boyut ve renkte: ikisi tek bir ad gibi okunur. */
    .brand { display: flex; align-items: center; gap: 6px; --brand-text: #3f464b; }
    .brand h1 { margin: 0; font-weight: 500; font-size: 19px; line-height: 1; padding-top: 2px; color: var(--brand-text); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .logo { height: 34px; width: auto; display: block; }
    /* Koyu temada yazısı açık renkli logo gösterilir. */
    .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .logo-light { display: none; }
      :root:not([data-theme="light"]) .logo-dark { display: block; }
      :root:not([data-theme="light"]) .brand { --brand-text: #dbdbdf; }
    }
    :root[data-theme="dark"] .logo-light { display: none; }
    :root[data-theme="dark"] .logo-dark { display: block; }
    :root[data-theme="dark"] .brand { --brand-text: #dbdbdf; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .top-nav { display: flex; gap: 4px; }
    .top-nav a { padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
    .top-nav a:hover { color: var(--text); background: var(--code-bg); }
    .top-nav a[aria-current="page"] { color: var(--text); font-weight: 600; background: var(--code-bg); }
    .catalog-all { font-size: 13px; white-space: nowrap; }
    .user-box { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .user-box[hidden] { display: none; }
    .user-box .avatar {
      width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 12px;
    }
    .user-box .name { color: var(--text); font-weight: 500; }
    .user-box a { color: var(--muted); }
    .user-box a:hover { color: var(--text); }
    .theme-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
    .theme-switch button {
      background: transparent; color: var(--muted); border: 0; border-radius: 0; padding: 5px 12px;
      font-size: 13px; font-weight: 500;
    }
    .theme-switch button + button { border-left: 1px solid var(--border); }
    .theme-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .subtitle { color: var(--muted); margin: 0 0 24px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    textarea {
      width: 100%; min-height: 90px; resize: vertical; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
      font: inherit;
    }
    .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1 1 220px; }
    select {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    button {
      background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
      padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .hint { color: var(--muted); font-size: 13px; }
    #steps { margin-top: 20px; }
    #steps:empty { display: none; }
    #steps summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    #steps ol { margin: 8px 0 0; padding-left: 22px; color: var(--muted); font-size: 13px; }
    #steps li { word-break: break-word; }
    #steps .phase { margin: 10px 0 4px; color: var(--text); font-weight: 600; font-size: 13px; }
    #steps .phase + ol { margin-top: 0; }
    .run-pill {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding: 10px 14px;
      border: 1px solid var(--accent); border-radius: 10px; background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      font-size: 14px;
    }
    .run-pill[hidden] { display: none; }
    .run-pill .q { color: var(--muted); flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-pill button { padding: 5px 12px; font-size: 13px; }
    .run-pill.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
    .run-pill.failed { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
    #notice { margin-top: 20px; }
    #notice:empty { display: none; }
    #answer { margin-top: 20px; }
    #answer:empty { display: none; }
    #answer h1, #answer h2, #answer h3 { line-height: 1.3; margin: 1.2em 0 .5em; }
    #answer h1 { font-size: 20px; } #answer h2 { font-size: 18px; } #answer h3 { font-size: 16px; }
    #answer code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; word-break: break-word; }
    #answer pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
    #answer pre code { padding: 0; }
    #answer table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    #answer th, #answer td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    #answer blockquote { margin: 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
    .error { color: var(--error); background: var(--error-bg); border-radius: 8px; padding: 10px 14px; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Kural kataloğu */
    #catalog { margin-top: 16px; }
    #catalog:empty { display: none; }
    #catalog h2 { font-size: 15px; margin: 0 0 8px; }
    .catalog-list { list-style: none; margin: 0; padding: 0; }
    .catalog-list li {
      display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
      padding: 8px 0; border-top: 1px solid var(--border); cursor: pointer;
    }
    .catalog-list li:first-child { border-top: 0; }
    .catalog-list li.active { background: var(--code-bg); border-radius: 6px; padding-left: 6px; padding-right: 6px; }
    .catalog-top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 8px; }
    .catalog-top h2 { margin: 0; flex: 1 1 260px; }
    .catalog-top input {
      flex: 1 1 240px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
    }
    .catalog-list .snippet { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .catalog-list mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
    .catalog-list .arrow { color: var(--muted); width: 12px; flex: 0 0 12px; }
    .close-btn { float: right; padding: 4px 10px; font-size: 12px; margin-left: 8px; }
    .catalog-list .q { flex: 1; min-width: 0; word-break: break-word; }
    .catalog-list .meta { color: var(--muted); font-size: 12px; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.stale { color: var(--warn); border-color: var(--warn); }
    .catalog-header { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    /* Token kullanımı özeti */
    #usage:empty { display: none; }
    #usage { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .usage-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .usage-tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
    .usage-tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .usage-tile .k { font-size: 12px; color: var(--muted); }
    .usage-tile.main { border-color: var(--accent); }
    .usage-tile.main .v { color: var(--accent); }
    .usage-note { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
    .usage-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; background: var(--border); }
    .usage-bar span { display: block; height: 100%; }
    .usage-bar .cached { background: #3fa37a; }
    .usage-bar .full { background: #d98b2b; }
    .usage-legend { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
    .usage-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    #usage details { margin-top: 10px; font-size: 13px; }
    #usage summary { cursor: pointer; color: var(--muted); }
    #usage table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
    #usage th, #usage td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    #usage th:first-child, #usage td:first-child { text-align: left; }
    #usage th { color: var(--muted); font-weight: 500; }
    #usage .table-wrap { overflow-x: auto; }
    .catalog-header ul { margin: 6px 0 0; padding-left: 20px; color: var(--warn); }
    #approve { margin-top: 12px; }
    #approve:empty { display: none; }
    #approve input, #approve textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; margin-bottom: 8px;
    }
    #approve textarea { min-height: 60px; resize: vertical; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .sync-status { font-size: 12px; color: var(--muted); margin: 36px 0 0; padding-top: 12px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .sync-status:empty { display: none; }
    .sync-status .err { color: var(--error); }
    .sync-status button { padding: 3px 10px; font-size: 12px; }
    /* Soru alanının altı: mod seçici solda, Sor düğmesi sağda */
    .ask-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .mode-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .mode-picker .lbl { font-size: 13px; color: var(--muted); }
    .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0; padding: 0; }
    .mode { position: relative; cursor: pointer; }
    .mode input { position: absolute; opacity: 0; pointer-events: none; }
    .mode span { display: block; padding: 6px 14px; font-size: 13px; color: var(--muted); }
    .mode + .mode span { border-left: 1px solid var(--border); }
    .mode input:checked + span { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .mode input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
    .mode-desc { font-size: 12.5px; color: var(--muted); }
    .ask-row #ask { padding: 9px 26px; }
    .status-row { margin-top: 8px; min-height: 1.4em; }
    /* Yazarken beliren benzer onaylı kurallar */
    .related { margin-top: 10px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 5%, var(--panel)); padding: 8px 12px; font-size: 13px; }
    .related[hidden] { display: none; }
    .related .head { color: var(--muted); margin-bottom: 4px; }
    .related .head strong { color: var(--text); }
    .related ul { list-style: none; margin: 0; padding: 0; }
    .related li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); cursor: pointer; }
    .related li:first-child { border-top: 0; }
    .related li:hover .rq { color: var(--accent); }
    .related .rq { color: var(--text); }
    .related .rm { color: var(--muted); font-size: 12px; }
    /* Katalog özeti: tek satır */
    .catalog-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .catalog-line:empty { display: none; }
    .catalog-line strong { color: var(--text); }
    .badge.info { color: var(--muted); }
    .match-banner { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .match-banner button { margin-top: 8px; }
    details.tech { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 12px; font-size: 13px; color: var(--muted); }
    details.tech summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brand">
      <img class="logo logo-light" src="img/promena-logo.png" alt="Promena" width="106" height="34">
      <img class="logo logo-dark" src="img/promena-logo-dark.png" alt="Promena" width="106" height="34">
      <h1><span class="visually-hidden">Promena </span>Rehberi</h1>
    </div>
    <div class="topbar-right">
      <nav class="top-nav" aria-label="Sayfalar">
        <a href="/" aria-current="page">Soru sor</a>
        <a href="/rules" id="rulesNavLink">Onaylı kurallar</a>
      </nav>
      <div id="userBox" class="user-box" hidden></div>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="system" title="İşletim sisteminin ayarını kullan">Sistem</button>
        <button type="button" data-theme-choice="light">Açık</button>
        <button type="button" data-theme-choice="dark">Koyu</button>
      </div>
    </div>
  </div>
  <p class="subtitle">İş kurallarını sorun; cevap kaynak koddan, sade bir dille ve örneklerle gelir.</p>

  <div class="panel">
    <div class="filters">
      <label>İhale tipi
        <select id="scope"></select>
      </label>
      <label>Konu
        <select id="topic"></select>
      </label>
    </div>
    <textarea id="question" placeholder="Örnek: Teklif verirken hangi kontroller hangi sırayla yapılır?"></textarea>
    <div id="related" class="related" hidden aria-live="polite"></div>
    <div class="ask-row">
      <div class="mode-picker">
        <span class="lbl" id="modesLabel">Mod</span>
        <div class="modes" id="modes" role="radiogroup" aria-labelledby="modesLabel"></div>
        <span class="mode-desc" id="modeDesc"></span>
      </div>
      <button id="ask">Sor</button>
    </div>
    <div class="status-row"><span id="status" class="hint">Ctrl + Enter ile de gönderebilirsiniz. Katalogda cevap yoksa model seçtiğiniz modda inceler.</span></div>
    <div id="catalog" class="catalog-line"></div>
    <div id="usage"></div>
  </div>

  <div id="runPill" class="run-pill" hidden role="status"></div>
  <div id="steps"></div>
  <div id="notice" class="error" role="alert"></div>
  <div id="answer"></div>
  <div id="approve" class="panel"></div>
  <footer id="syncStatus" class="sync-status"></footer>
</main>

<script>
  // Oturum süresi dolarsa (401) giriş ekranına dön. Giriş kapalıysa sunucu 401 döndürmez.
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await nativeFetch(...args);
    if (res.status === 401) location.href = "/login";
    return res;
  };

  // Giriş yapan kullanıcı (giriş kapalıysa null). Onay formunda onaylayan olarak kullanılır.
  let currentUser = null;
  fetch("/api/me").then((r) => (r.ok ? r.json() : null)).then((me) => {
    if (!me?.authEnabled || !me.signedIn) return;
    currentUser = me;
    const box = document.getElementById("userBox");
    const initials = (me.name || me.email || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toLocaleUpperCase("tr-TR");
    box.innerHTML = `<span class="avatar" aria-hidden="true">${escapeHtml(initials)}</span>` +
      `<span class="name" title="${escapeHtml(me.email || "")}">${escapeHtml(me.name || me.email)}</span>` +
      `<a href="/auth/logout">Çıkış</a>`;
    box.hidden = false;
    if (lastAsk) showApproveForm();   // açık onay formu varsa adla güncellensin
  }).catch(() => { /* kullanıcı bilgisi alınamazsa ekran yine çalışır */ });

  // Tema seçimi: "system" işletim sisteminin ayarını izler; seçim tarayıcıda hatırlanır.
  (function initThemeSwitch() {
    const buttons = document.querySelectorAll("[data-theme-choice]");
    function apply(choice) {
      if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
      else delete document.documentElement.dataset.theme;
      for (const b of buttons) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice));
      try {
        if (choice === "system") localStorage.removeItem("kodAnalistTheme");
        else localStorage.setItem("kodAnalistTheme", choice);
      } catch { /* depolama kapalıysa yalnızca bu oturumda geçerli olur */ }
    }
    for (const b of buttons) b.addEventListener("click", () => apply(b.dataset.themeChoice));
    apply(document.documentElement.dataset.theme || "system");
  })();

  const questionEl = document.getElementById("question");
  const askBtn = document.getElementById("ask");
  const statusEl = document.getElementById("status");
  const stepsEl = document.getElementById("steps");
  const answerEl = document.getElementById("answer");
  const scopeEl = document.getElementById("scope");
  const topicEl = document.getElementById("topic");

  const catalogEl = document.getElementById("catalog");
  const approveEl = document.getElementById("approve");
  let catalogEnabled = false;
  let lastAsk = null;   // { question, scopeId, topicId, answer, mode, verified } — onaylama formu için

  // İhale tipi ve konu listelerini sunucudan yükle. "Tümü" seçeneği yok: her soru bir ihale tipi ve konuyla
  // sorulur (başlangıç paketi ve önbellek ancak böyle çalışır). Son seçim tarayıcıda hatırlanır.
  const SELECTION_KEY = "kodAnalistSelection";
  fetch("/api/scopes").then((r) => r.json()).then((data) => {
    for (const s of data.scopes) scopeEl.add(new Option(s.label, s.id));
    for (const t of data.topics) topicEl.add(new Option(t.label, t.id));
    try {
      const saved = JSON.parse(localStorage.getItem(SELECTION_KEY) || "null");
      if (saved && [...scopeEl.options].some((o) => o.value === saved.scopeId)) scopeEl.value = saved.scopeId;
      if (saved && [...topicEl.options].some((o) => o.value === saved.topicId)) topicEl.value = saved.topicId;
    } catch { /* depolama kapalıysa ilk seçenekler kalır */ }
    // Kurallar sayfasından "Ana ekranda yeniden incele" ile gelindiyse: soru, ihale tipi ve konu hazır gelir.
    const incoming = new URLSearchParams(location.search);
    if (incoming.has("question")) {
      if ([...scopeEl.options].some((o) => o.value === incoming.get("scope"))) scopeEl.value = incoming.get("scope");
      if ([...topicEl.options].some((o) => o.value === incoming.get("topic"))) topicEl.value = incoming.get("topic");
      questionEl.value = incoming.get("question");
      history.replaceState(null, "", "/");
      try { sessionStorage.removeItem("kodAnalistRun"); } catch { }   // eski inceleme yerine bu soru gösterilsin
      setTimeout(() => questionEl.focus(), 0);
    }
    renderModes(data.modes || []);
    if (catalogEnabled) loadCatalog();   // katalog listeden önce yüklendiyse seçime göre yenile
    resumeSavedRun();
  }).catch(() => { /* liste yüklenemezse kapsam olmadan çalışır */ });

  // Cevap modları (Hızlı / Dengeli / Derin). Seçim tarayıcıda hatırlanır.
  const modesEl = document.getElementById("modes");
  let modes = [];
  function renderModes(list) {
    modes = list;
    if (list.length === 0) { modesEl.style.display = "none"; return; }
    let saved = null;
    try { saved = localStorage.getItem("kodAnalistMode"); } catch { /* depolama kapalı olabilir */ }
    const selected = list.find((m) => m.id === saved) || list.find((m) => m.isDefault) || list[0];
    for (const m of list) {
      const label = document.createElement("label");
      label.className = "mode";
      label.title = m.description;
      label.innerHTML = `<input type="radio" name="mode" value="${escapeHtml(m.id)}"${m.id === selected.id ? " checked" : ""}>` +
        `<span>${escapeHtml(m.label)}</span>`;
      label.querySelector("input").addEventListener("change", (e) => {
        try { localStorage.setItem("kodAnalistMode", e.target.value); } catch { /* yok say */ }
        showModeDesc();
      });
      modesEl.appendChild(label);
    }
    showModeDesc();
  }
  // Seçili modun kısa açıklaması seçicinin yanında.
  function showModeDesc() {
    document.getElementById("modeDesc").textContent = selectedMode()?.description || "";
  }
  function selectedMode() {
    const id = modesEl.querySelector("input[name=mode]:checked")?.value;
    return modes.find((m) => m.id === id) || null;
  }
  function modeLabel(id) {
    return modes.find((m) => m.id === id)?.label || id;
  }

  // Repoların otomatik güncellenme durumu (RepoSync açıksa görünür).
  const syncEl = document.getElementById("syncStatus");
  function timeAgo(iso) {
    if (!iso) return "—";
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "az önce";
    if (min < 60) return `${min} dk önce`;
    return `${Math.round(min / 60)} saat önce`;
  }
  async function loadSyncStatus() {
    try {
      const s = await fetch("/api/sync-status").then((r) => r.json());
      if (!s.enabled) { syncEl.innerHTML = ""; return; }
      const repos = s.repos.map((r) =>
        r.error
          ? `<span class="err" title="${escapeHtml(r.error)}">${escapeHtml(r.name)}: güncellenemedi</span>`
          : `<span title="Son değişiklik: ${timeAgo(r.lastChangeAt)}">${escapeHtml(r.name)} (${escapeHtml(r.branch)} · ${escapeHtml(r.commit || "—")})</span>`
      ).join(" · ");
      const lastCheck = s.repos.map((r) => r.lastCheckAt).filter(Boolean).sort().pop();
      syncEl.innerHTML =
        `<span>Kod: ${repos || "repolar hazırlanıyor…"}</span>` +
        `<span>· son kontrol ${timeAgo(lastCheck)}</span>` +
        (s.mapError ? `<span class="err">· ${escapeHtml(s.mapError)}</span>` : "") +
        (s.running ? `<span>· güncelleniyor…</span>` : `<button class="secondary" id="syncNowBtn">Şimdi güncelle</button>`);
      document.getElementById("syncNowBtn")?.addEventListener("click", async () => {
        await fetch("/api/sync-now", { method: "POST" });
        setTimeout(loadSyncStatus, 1000);
      });
    } catch { syncEl.innerHTML = ""; }
  }
  loadSyncStatus();
  setInterval(loadSyncStatus, 30000);

  fetch("/api/catalog/status").then((r) => r.json()).then((s) => {
    catalogEnabled = s.configured;
    loadCatalog();
  }).catch(() => {});

  // Katalogdan açılan kayıt (açılır / kapanır). answerFromCatalog: cevap alanında katalog içeriği mi var?
  let openEntryKey = null;
  let answerFromCatalog = false;

  // İhale tipi veya konu değişince açık katalog kaydı kapanır ve liste yeni seçime göre yeniden gelir.
  function onSelectionChange() {
    try { localStorage.setItem(SELECTION_KEY, JSON.stringify({ scopeId: scopeEl.value, topicId: topicEl.value })); }
    catch { /* depolama kapalı olabilir */ }
    closeCatalogEntry();
    loadCatalog();
    scheduleRelated();
  }
  scopeEl.addEventListener("change", onSelectionChange);
  topicEl.addEventListener("change", onSelectionChange);

  function markActiveEntry() {
    for (const li of catalogEl.querySelectorAll("li[data-key]")) {
      const active = li.dataset.key === openEntryKey;
      li.classList.toggle("active", active);
      const arrow = li.querySelector(".arrow");
      if (arrow) arrow.textContent = active ? "▾" : "▸";
    }
  }

  function closeCatalogEntry() {
    if (answerFromCatalog) {
      answerEl.className = "";
      answerEl.innerHTML = "";
      approveEl.innerHTML = "";
      statusEl.textContent = "";
    }
    answerFromCatalog = false;
    openEntryKey = null;
    markActiveEntry();
    if (currentRun && !currentRun.visible) showRun();   // katalog kapandı: arka plandaki inceleme geri gelsin
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
  }

  function formatDate(iso) {
    try { return new Date(iso).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" }); }
    catch { return iso; }
  }

  // Katalog satırlarındaki ortak bilgiler: onaylayan, tarih ve (varsa) doğrulanmamış işareti.
  function entryMeta(e, extra) {
    return `${escapeHtml(e.approvedBy)} · ${formatDate(e.approvedAt)}` +
      (e.isVerified === false ? ` · doğrulanmamış${e.mode ? " (" + escapeHtml(modeLabel(e.mode)) + " mod)" : ""}` : "") +
      (extra ? " · " + extra : "");
  }
  function freshnessBadge(e) {
    return e.upToDate ? '<span class="badge ok">güncel</span>' : '<span class="badge stale">kod değişti</span>';
  }

  // Aranan kelimeleri alıntıda vurgular (metin önce güvenli hale getirilir).
  function highlight(text, query) {
    let html = escapeHtml(text);
    const terms = query.toLocaleLowerCase("tr-TR").split(/\s+/).filter((t) => t.length > 1);
    for (const t of terms) {
      const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "giu");
      html = html.replace(re, (m) => `<mark>${m}</mark>`);
    }
    return html;
  }

  // Katalog özeti: seçili ihale tipi ve konudaki onaylı kural sayısı ve kurallar sayfasına bağlantı.
  // Kuralları gezmek, aramak ve filtrelemek ayrı sayfada (/rules); burada yalnızca özet ve yazarken öneriler var.
  function rulesLink() {
    const q = new URLSearchParams();
    if (scopeEl.value) q.set("scope", scopeEl.value);
    if (topicEl.value) q.set("topic", topicEl.value);
    return "/rules" + (q.toString() ? "?" + q : "");
  }

  async function loadCatalog() {
    if (!catalogEnabled) { catalogEl.innerHTML = ""; return; }
    const params = new URLSearchParams();
    if (scopeEl.value) params.set("scope", scopeEl.value);
    if (topicEl.value) params.set("topic", topicEl.value);
    try {
      const res = await fetch("/api/catalog?" + params);
      const data = await res.json();
      if (!res.ok) { catalogEl.innerHTML = `<span>${escapeHtml(data.error || "Katalog yüklenemedi.")}</span>`; return; }
      const changed = data.filter((e) => !e.upToDate).length;
      catalogEl.innerHTML = data.length === 0
        ? `<span>Bu ihale tipi ve konuda henüz onaylı kural yok. Cevabı onaylarsanız kataloğa eklenir.</span><a href="/rules">Tüm kurallar →</a>`
        : `<span>Bu ihale tipi ve konuda <strong>${data.length}</strong> onaylı kural` +
          (changed ? ` · <span style="color:var(--warn)">${changed} tanesinde kod değişti</span>` : "") +
          `</span><a id="catalogAllLink" href="${rulesLink()}">Tümünü gör →</a>`;
    } catch {
      catalogEl.innerHTML = "";
    }
  }

  // ---- Yazarken benzer onaylı kurallar ----
  // Soru yazıldıkça (kısa bir bekleme ile) katalogda aynı / benzer onaylı soru aranır; model çağrılmaz.
  const relatedEl = document.getElementById("related");
  let relatedTimer = null, relatedNo = 0;
  function scheduleRelated() {
    clearTimeout(relatedTimer);
    relatedTimer = setTimeout(loadRelated, 600);
  }
  async function loadRelated() {
    const question = questionEl.value.trim();
    const my = ++relatedNo;
    if (!catalogEnabled || question.length < 12) { relatedEl.hidden = true; return; }
    let m;
    try {
      const res = await fetch("/api/catalog/match", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, scopeId: scopeEl.value || null, topicId: topicEl.value || null }),
      });
      m = await res.json();
    } catch { return; }
    if (my !== relatedNo) return;   // bu arada soru değişti
    const items = [m.exact, m.best, ...(m.similar || [])].filter(Boolean).slice(0, 3);
    if (items.length === 0) { relatedEl.hidden = true; return; }
    const head = m.exact
      ? "<strong>Bu soru katalogda var.</strong> Sor'a basınca model çalışmadan açılır."
      : m.best
        ? "<strong>Çok benzer onaylı bir kural var.</strong> Sor'a basınca model çalışmadan açılır."
        : `<strong>${items.length} benzer onaylı kural</strong> var; aradığınız bunlardan biri olabilir.`;
    relatedEl.innerHTML = `<div class="head">💡 ${head}</div><ul>` + items.map((e) =>
      `<li data-scope="${escapeHtml(e.scopeId)}" data-id="${escapeHtml(e.id)}" data-score="${e.score ?? 1}">` +
      `<span><span class="rq">${escapeHtml(e.question)}</span> <span class="rm">· benzerlik %${Math.round((e.score ?? 1) * 100)}</span></span>` +
      `${freshnessBadge(e)}</li>`).join("") + "</ul>";
    relatedEl.hidden = false;
    for (const li of relatedEl.querySelectorAll("li")) li.addEventListener("click", () => {
      const banner = `Yazdığınız soruya benzer onaylı kural (benzerlik %${Math.round(li.dataset.score * 100)}). Model çağrılmadı.` +
        `<div><button id="notThisBtn" class="secondary">Bu değil, modele sor (${escapeHtml(selectedMode()?.label || "model")} mod)</button></div>`;
      openCatalogEntry(li.dataset.scope, li.dataset.id, banner);
    });
  }
  questionEl.addEventListener("input", scheduleRelated);

  // banner: katalog eşleşmesiyle (Sor düğmesinden) açıldıysa üstte gösterilecek açıklama (HTML).
  async function openCatalogEntry(scopeId, id, banner) {
    hideRun();
    const res = await fetch(`/api/catalog/${encodeURIComponent(scopeId)}/${encodeURIComponent(id)}`);
    const data = await res.json();
    if (!res.ok) { answerEl.className = "error"; answerEl.textContent = data.error || "Kayıt açılamadı."; return; }
    const e = data.entry;
    stepsEl.innerHTML = "";
    approveEl.innerHTML = "";
    const status = data.upToDate
      ? '<span class="badge ok">Kod değişmedi, cevap güncel</span>'
      : `<span class="badge stale">Kod değişti — yeniden doğrulanmalı</span><ul>${data.changes.map((c) => `<li>${escapeHtml(c)}</li>`).join("")}</ul>`;
    const unverified = e.verified === false
      ? ` · <span class="badge stale">Doğrulanmamış${e.mode ? " — " + escapeHtml(modeLabel(e.mode)) + " modda üretildi" : ""}</span>`
      : "";
    answerEl.className = "panel";
    answerEl.innerHTML = (banner ? `<div class="match-banner">${banner}</div>` : "") +
      `<div class="catalog-header"><button class="secondary close-btn" id="closeEntryBtn">Kapat ✕</button>` +
      `Katalogdan · ${escapeHtml(e.approvedBy)} tarafından ${formatDate(e.approvedAt)} tarihinde onaylandı · ${status}${unverified}` +
      (e.note ? `<div><strong>Not:</strong> ${escapeHtml(e.note)}</div>` : "") + `</div>` +
      `<p><strong>Soru:</strong> ${escapeHtml(e.question)}</p>` + renderAnswer(e.answer);
    document.getElementById("closeEntryBtn").addEventListener("click", closeCatalogEntry);
    document.getElementById("notThisBtn")?.addEventListener("click", () => ask(true));
    answerFromCatalog = true;
    openEntryKey = `${scopeId}|${id}`;
    markActiveEntry();
    statusEl.textContent = data.upToDate
      ? "Katalogdan gösterildi; model çağrılmadı, token harcanmadı."
      : "Katalogdan gösterildi. Kod değiştiği için yeniden inceleyip cevabı tekrar onaylamanız önerilir.";
    if (!banner) questionEl.value = e.question;   // eşleşmeyle açıldıysa analistin kendi sorusu kutuda kalsın

    // Analist isterse aynı soruyu yeniden inceletebilir (yalnızca bu düğmeyle model çalışır).
    approveEl.innerHTML = `
      <div class="hint" style="margin-bottom:8px">${data.upToDate
        ? "Bu cevap onaylı ve dayandığı kod değişmedi. Yine de yeniden incelemek isterseniz model çalışır ve token harcanır."
        : "Bu cevabın dayandığı kod değişti. Yeniden inceleyip yeni cevabı onaylamanız önerilir."}</div>
      <button id="reaskBtn" class="${data.upToDate ? "secondary" : ""}">Yeniden incele (model çalışır)</button>`;
    document.getElementById("reaskBtn").addEventListener("click", () => ask(true));
  }

  // "Sor" düğmesi: model çağrılmadan önce katalogda aynı / benzer onaylı soru aranır.
  // Dönüş değeri true ise katalog sonucu gösterildi demektir; model çağrılmaz.
  async function tryCatalogFirst(question) {
    if (!catalogEnabled) return false;
    setBusy(true, "Katalogda aranıyor…");
    let m;
    try {
      const res = await fetch("/api/catalog/match", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, scopeId: scopeEl.value || null, topicId: topicEl.value || null }),
      });
      m = await res.json();
    } catch {
      setBusy(false, "");
      return false;   // katalog erişilemezse normal akışa devam
    }
    setBusy(false, "");

    if (m.exact) {
      await openCatalogEntry(m.exact.scopeId, m.exact.id);
      return true;
    }
    if (m.best) {
      // Sorunuza çok yakın, kodu değişmemiş onaylı kural: model çağrılmadan doğrudan açılır.
      const others = (m.similar || []).map((e) =>
        `<li data-scope="${escapeHtml(e.scopeId)}" data-id="${escapeHtml(e.id)}"><div class="q">${escapeHtml(e.question)}` +
        `<div class="meta">${entryMeta(e, "benzerlik %" + Math.round(e.score * 100))}</div></div>${freshnessBadge(e)}</li>`).join("");
      const banner =
        `Sorunuza en yakın onaylı kural gösteriliyor (benzerlik %${Math.round(m.best.score * 100)}). ` +
        `Model çağrılmadı, token harcanmadı.<br><strong>Eşleşen soru:</strong> ${escapeHtml(m.best.question)}` +
        (others ? `<div style="margin-top:6px">Diğer benzer kurallar:</div><ul class="catalog-list">${others}</ul>` : "") +
        `<div><button id="notThisBtn" class="secondary">Bu değil, modele sor (${escapeHtml(selectedMode()?.label || "model")} mod)</button></div>`;
      await openCatalogEntry(m.best.scopeId, m.best.id, banner);
      for (const li of answerEl.querySelectorAll(".match-banner li[data-id]"))
        li.addEventListener("click", () => openCatalogEntry(li.dataset.scope, li.dataset.id));
      statusEl.textContent = "Katalogdan gösterildi; model çağrılmadı, token harcanmadı.";
      return true;
    }
    if (m.similar && m.similar.length > 0) {
      hideRun();
      stepsEl.innerHTML = "";
      approveEl.innerHTML = "";
      answerEl.className = "panel";
      answerEl.innerHTML = `<h2 style="font-size:16px;margin-top:0">Bu soruya benzer onaylı kurallar var</h2>
        <p class="hint">Aradığınız bunlardan biriyse tıklayın; model çağrılmadan açılır.</p>
        <ul class="catalog-list"></ul>
        <button id="newAskBtn" class="secondary" style="margin-top:12px">Hiçbiri değil, modele sor (${escapeHtml(selectedMode()?.label || "model")} mod)</button>`;
      const list = answerEl.querySelector("ul");
      for (const e of m.similar) {
        const li = document.createElement("li");
        li.innerHTML = `<div class="q">${escapeHtml(e.question)}<div class="meta">${entryMeta(e, "benzerlik %" + Math.round(e.score * 100))}</div></div>` +
          freshnessBadge(e);
        li.addEventListener("click", () => openCatalogEntry(e.scopeId, e.id));
        list.appendChild(li);
      }
      document.getElementById("newAskBtn").addEventListener("click", () => ask(true));
      statusEl.textContent = "Katalogda benzer kurallar bulundu; model çağrılmadı.";
      answerFromCatalog = true;   // seçim değişirse bu öneri listesi de temizlenir
      openEntryKey = null;
      markActiveEntry();
      return true;
    }
    return false;
  }

  // Yapay zekânın cevabının altında: onaylayıp kataloğa kaydetme formu.
  function showApproveForm() {
    if (!catalogEnabled || !lastAsk) { approveEl.innerHTML = ""; return; }
    const warn = lastAsk.verified === false
      ? `<div class="hint" style="margin-bottom:8px"><span class="badge stale">Doğrulanmamış cevap</span> Bu cevap koda karşı doğrulanmadı.
         Kaydederseniz katalogda "doğrulanmamış" olarak işaretlenir. Kaydetmeden önce cevabı dikkatle kontrol edin.</div>`
      : "";
    approveEl.innerHTML = warn + `
      <div class="hint" style="margin-bottom:8px">Cevabı kontrol ettiyseniz kataloğa kaydedin. Aynı veya benzer soru tekrar sorulduğunda model çağrılmadan bu cevap gösterilir; dayandığı kod değişirse "kod değişti" olarak işaretlenir.</div>
      ${currentUser
        ? `<div class="hint" style="margin-bottom:8px">Onaylayan: <strong>${escapeHtml(currentUser.name || currentUser.email)}</strong></div>`
        : '<input id="approvedBy" placeholder="Adınız (zorunlu)" maxlength="100">'}
      <textarea id="approveNote" placeholder="Not (isteğe bağlı) — ör. düzeltmeler, ekibe bildirilen hatalar"></textarea>
      <button id="approveBtn">Onayla ve kataloğa kaydet</button>
      <span id="approveStatus" class="hint"></span>`;
    document.getElementById("approveBtn").addEventListener("click", saveToCatalog);
  }

  async function saveToCatalog() {
    // Giriş açıksa onaylayan, giriş yapan hesaptır (sunucu da bunu kullanır).
    const approvedBy = currentUser ? (currentUser.name || currentUser.email) : document.getElementById("approvedBy").value.trim();
    const note = document.getElementById("approveNote").value.trim();
    const statusSpan = document.getElementById("approveStatus");
    if (!approvedBy) { statusSpan.textContent = "Lütfen adınızı yazın."; return; }
    const btn = document.getElementById("approveBtn");
    btn.disabled = true;
    statusSpan.textContent = "Kaydediliyor…";
    try {
      const res = await fetch("/api/catalog", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...lastAsk, approvedBy, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      statusSpan.textContent = `Kaydedildi (${data.sources} kod dayanağı izleniyor).`;
      lastAsk = null;
      loadCatalog();
    } catch (err) {
      statusSpan.textContent = "Kaydedilemedi: " + err.message;
      btn.disabled = false;
    }
  }

  // Kütüphaneler bir sebeple yüklenemezse cevap kaybolmasın: düz metin olarak gösterilir.
  function renderMarkdown(md) {
    if (typeof marked === "undefined" || typeof DOMPurify === "undefined")
      return `<div style="white-space:pre-wrap">${escapeHtml(md)}</div>`;
    return DOMPurify.sanitize(marked.parse(md));
  }

  // Cevap iki bölümdür: analistin okuyacağı sade dil kısmı ve kod referanslarını içeren "Teknik dayanaklar".
  // Teknik kısım varsayılan olarak kapalı gösterilir (doğrulama ve katalog takibi için korunur).
  const TECH_HEADING = /^##\s+Teknik dayanaklar.*$/m;
  function renderAnswer(md) {
    const m = md.match(TECH_HEADING);
    if (!m) return renderMarkdown(md);
    const analystPart = md.slice(0, m.index).trim();
    const techPart = md.slice(m.index + m[0].length).trim();
    return renderMarkdown(analystPart) +
      `<details class="tech"><summary>Teknik dayanaklar (geliştiriciler için)</summary>${renderMarkdown(techPart)}</details>`;
  }

  // ---------------- Token kullanımı özeti ----------------
  const usageEl = document.getElementById("usage");

  function fmtTokens(n) {
    if (n >= 1e6) return (n / 1e6).toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " milyon";
    if (n >= 1e4) return Math.round(n / 1e3).toLocaleString("tr-TR") + " bin";
    if (n >= 1e3) return (n / 1e3).toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + " bin";
    return n.toLocaleString("tr-TR");
  }
  function fmtSeconds(s) {
    s = Math.round(s);
    return s < 60 ? s + " sn" : Math.floor(s / 60) + " dk " + (s % 60) + " sn";
  }

  // Sunucudan gelen JSON'u (mod + aşamalar) özet kartları, açıklama ve aşama tablosu olarak çizer.
  // Eski biçimdeki düz metin gelirse olduğu gibi gösterilir.
  function renderUsage(text) {
    let data;
    try { data = JSON.parse(text); } catch { usageEl.innerHTML = `<p class="usage-note">${escapeHtml(text)}</p>`; return; }
    const sum = k => data.phases.reduce((a, p) => a + (p[k] || 0), 0);
    const input = sum("input"), cacheRead = sum("cacheRead"), billed = sum("billedInput");
    const output = sum("output"), requests = sum("requests"), seconds = sum("seconds");
    const cachedPct = input ? Math.round(cacheRead * 100 / input) : 0;

    const rows = data.phases.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${p.requests}</td><td>${fmtSeconds(p.seconds)}</td>` +
      `<td>${p.input.toLocaleString("tr-TR")}</td><td>${p.cacheRead.toLocaleString("tr-TR")}</td>` +
      `<td>${(p.uncached + p.cacheWrite).toLocaleString("tr-TR")}</td><td><strong>${p.billedInput.toLocaleString("tr-TR")}</strong></td>` +
      `<td>${p.output.toLocaleString("tr-TR")}</td></tr>`).join("");

    usageEl.innerHTML =
      `<div class="usage-tiles">` +
        `<div class="usage-tile main"><div class="v">≈ ${fmtTokens(billed)}</div><div class="k">Faturaya yansıyan girdi token'ı</div></div>` +
        `<div class="usage-tile"><div class="v">${fmtTokens(output)}</div><div class="k">Çıktı token'ı (cevap + düşünme)</div></div>` +
        `<div class="usage-tile"><div class="v">${fmtSeconds(seconds)}</div><div class="k">Süre · ${escapeHtml(data.mode || "")} mod</div></div>` +
        `<div class="usage-tile"><div class="v">${requests}</div><div class="k">Model isteği</div></div>` +
      `</div>` +
      `<div class="usage-bar" title="Gönderilen girdinin önbellekten okunan kısmı">` +
        `<span class="cached" style="width:${cachedPct}%"></span><span class="full" style="width:${100 - cachedPct}%"></span></div>` +
      `<div class="usage-legend"><span><i style="background:#3fa37a"></i>Önbellekten: %${cachedPct} (onda bir fiyat)</span>` +
        `<span><i style="background:#d98b2b"></i>Tam fiyat: %${100 - cachedPct}</span></div>` +
      `<p class="usage-note">Model her adımda o ana kadar okunan kodu yeniden alır; bu yüzden ${requests} istekte toplam ` +
        `<strong>${fmtTokens(input)}</strong> girdi gönderildi. Bunun %${cachedPct}'i önbellekten okunduğu ve normal fiyatın ` +
        `onda biriyle faturalandığı için faturaya yaklaşık <strong>${fmtTokens(billed)}</strong> normal girdi token'ı olarak yansır.</p>` +
      `<details><summary>Aşama ayrıntısı</summary><div class="table-wrap"><table>` +
        `<tr><th>Aşama</th><th>İstek</th><th>Süre</th><th>Gönderilen girdi</th><th>Önbellekten</th>` +
        `<th>Tam fiyat / yazma</th><th>Faturalanan karşılığı</th><th>Çıktı</th></tr>${rows}</table></div>` +
        `<p class="usage-note">Faturalanan karşılığı = tam fiyat girdi + önbelleğe yazma × 1,25 (1 saatlik yazma × 2) + önbellekten okuma × 0,1.</p></details>`;
  }

  function setBusy(busy, text) {
    askBtn.disabled = busy;
    statusEl.innerHTML = busy ? '<span class="spinner"></span> ' + text : text;
  }

  // ---------------- Model incelemesi ----------------
  // İnceleme sunucuda tarayıcı bağlantısından bağımsız çalışır. Bağlantı koparsa ekran aynı incelemeye kaldığı
  // yerden yeniden bağlanır; sayfa yenilenirse son inceleme (süren ya da biten) baştan oynatılarak geri gelir.
  // Hata mesajları gelmiş taslağı / cevabı silmez, ayrı bir uyarı olarak gösterilir.
  const noticeEl = document.getElementById("notice");
  const RUN_KEY = "kodAnalistRun";
  const MAX_RECONNECTS = 6;
  let currentRun = null;   // ekranda gösterilen inceleme; yenisi başlayınca eskisi ekrana yazmayı bırakır

  function showNotice(text) { noticeEl.textContent = text; }
  function clearNotice() { noticeEl.textContent = ""; }
  function saveRun(run) {
    try {
      sessionStorage.setItem(RUN_KEY, JSON.stringify({ jobId: run.jobId, question: run.question, scopeId: run.scopeId,
        topicId: run.topicId, mode: run.modeId }));
    } catch { /* depolama kapalıysa yenilemede geri gelmez, başka etkisi yok */ }
  }
  function forgetRun() { try { sessionStorage.removeItem(RUN_KEY); } catch { /* yok say */ } }
  function savedRun() { try { return JSON.parse(sessionStorage.getItem(RUN_KEY) || "null"); } catch { return null; } }
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // ---- Arka planda inceleme ----
  // Kullanıcı inceleme sürerken kataloğu gezebilir: katalogdan bir kayıt açılınca inceleme ekrandan gizlenir ama
  // izlenmeye devam eder; gelen olaylar run.events içinde saklanır. "İncelemeye dön" ile (veya katalog kaydı
  // kapatılınca) olaylar baştan oynatılarak görünüm eksiksiz geri gelir.
  const runPillEl = document.getElementById("runPill");

  function hideRun() {
    clearNotice();
    if (!currentRun || !currentRun.visible) return;
    currentRun.visible = false;
    statusEl.textContent = "";
    updateRunPill();
  }

  function showRun() {
    const run = currentRun;
    if (!run) return;
    answerFromCatalog = false;
    openEntryKey = null;
    markActiveEntry();
    resetRunView(run);
    run.visible = true;
    for (const evt of run.events) {
      try { handleEvent(evt, run); } catch (err) { console.error(err); }
    }
    runPillEl.hidden = true;
    if (run.finished || run.stopped) setBusy(false, runSummary(run));
    else setBusy(true, run.statusText || "Kod inceleniyor…");
    stepsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function runSummary(run) {
    if (run.failed) return "İnceleme tamamlanamadı (ayrıntı yukarıda).";
    return run.stepCount + (run.verifiedRun ? " adımda incelendi ve doğrulandı." : " adımda incelendi (doğrulanmadı).");
  }

  // Gizli incelemenin durumu: katalog panelinin üstündeki şerit.
  function updateRunPill() {
    const run = currentRun;
    if (!run || run.visible) { runPillEl.hidden = true; return; }
    const failed = run.events.some((e) => e.Type === "error");
    const answered = run.events.some((e) => e.Type === "answer" || e.Type === "answer-unverified");
    const done = run.finished || run.stopped;
    const q = `<span class="q" title="${escapeHtml(run.question)}">“${escapeHtml(run.question)}”</span>`;
    let html;
    if (done && answered && !failed) {
      runPillEl.className = "run-pill done";
      html = `<span>✅ Cevap hazır</span>${q}<button type="button" id="showRunBtn">Cevabı göster</button>`;
    } else if (done) {
      runPillEl.className = "run-pill failed";
      html = `<span>⚠️ İnceleme tamamlanamadı</span>${q}<button type="button" class="secondary" id="showRunBtn">Ayrıntıyı göster</button>`;
    } else {
      runPillEl.className = "run-pill";
      html = `<span class="spinner"></span><span>Arka planda inceleniyor${run.statusText ? " · " + escapeHtml(run.statusText.replace(/\s*\(.*\)\s*$/, "").replace(/…$/, "")) : ""}</span>${q}` +
        `<button type="button" class="secondary" id="showRunBtn">İncelemeye dön</button>`;
    }
    runPillEl.innerHTML = html;
    runPillEl.hidden = false;
    document.getElementById("showRunBtn").addEventListener("click", () => {
      if (answerFromCatalog) { answerEl.className = ""; answerEl.innerHTML = ""; approveEl.innerHTML = ""; }
      showRun();
    });
  }

  // İnceleme durum satırı: görünürse ekrandaki satıra, gizliyse şeride yazılır.
  function setRunStatus(run, busy, text) {
    if (busy && text) run.statusText = text;
    if (run.visible) setBusy(busy, text);
    else { askBtn.disabled = busy; updateRunPill(); }
  }

  // İnceleme görünümünü sıfırlar (yeni inceleme veya olayları yeniden oynatmadan önce).
  function resetRunView(run) {
    stepsEl.innerHTML = '<details open><summary>İnceleme adımları</summary></details>';
    answerEl.className = "";
    answerEl.innerHTML = "";
    approveEl.innerHTML = "";
    usageEl.innerHTML = "";
    clearNotice();
    lastAsk = null;
    Object.assign(run, { stepCount: 0, usageText: "", verifiedRun: true, hasAnswer: false, final: false, failed: false,
      stepsBox: stepsEl.querySelector("details"), stepList: null });
  }

  // Yeni inceleme: görünüm temizlenir.
  function newRun(meta) {
    answerFromCatalog = false;   // cevap alanı artık yapay zekâ cevabını gösterecek
    openEntryKey = null;
    markActiveEntry();
    const run = { ...meta, jobId: null, next: 0, finished: false, stopped: false, visible: true, events: [], statusText: "" };
    resetRunView(run);
    currentRun = run;
    runPillEl.hidden = true;
    return run;
  }

  // Ekranın kendi ürettiği olaylar (bağlantı kurulamadı vb.) da kaydedilir; gizliyken de kaybolmaz.
  function localEvent(run, type, text) {
    const evt = { Type: type, Text: text };
    run.events.push(evt);
    if (run.visible) handleEvent(evt, run);
  }

  function handleEvent(evt, run) {
    const closeSteps = () => { const d = stepsEl.querySelector("details"); if (d) d.open = false; };
    if (evt.Type === "step") {
      if (!run.stepList) { run.stepList = document.createElement("ol"); run.stepsBox.appendChild(run.stepList); }
      const li = document.createElement("li");
      li.textContent = evt.Text;
      run.stepList.appendChild(li);
      run.stepCount++;
    } else if (evt.Type === "phase") {
      const div = document.createElement("div");
      div.className = "phase";
      div.textContent = evt.Text;
      run.stepsBox.appendChild(div);
      run.stepList = document.createElement("ol");
      run.stepsBox.appendChild(run.stepList);
      setRunStatus(run, true, evt.Text + "… (Adımlar ve süre aşağıda görünür.)");
    } else if (evt.Type === "draft") {
      // Doğrulama sürerken taslağı göster; onay formu yalnızca son halde çıkar.
      answerEl.className = "panel";
      answerEl.innerHTML =
        '<div class="catalog-header"><span class="badge stale">Taslak — doğrulanıyor</span> ' +
        'Bu cevap henüz koda karşı doğrulanmadı; son hali kısa süre içinde burada yerini alacak.</div>' +
        renderAnswer(evt.Text);
      run.hasAnswer = true;
      closeSteps();
    } else if (evt.Type === "answer-unverified") {
      // Doğrulamasız mod (ör. Hızlı) ya da doğrulama tamamlanamadı: cevap uyarıyla gösterilir. Analist kontrol edip
      // onaylarsa kataloğa "doğrulanmamış" işaretiyle kaydedilebilir.
      answerEl.className = "panel";
      answerEl.innerHTML =
        `<div class="catalog-header"><span class="badge stale">${escapeHtml(run.modeLabel || "Hızlı")} mod — doğrulanmadı</span> ` +
        'Bu cevap koda karşı doğrulanmadı ve yanlış ya da eksik bilgi içerebilir. Kritik bir karar için ' +
        'Dengeli veya Derin modla yeniden sorun.</div>' +
        renderAnswer(evt.Text);
      run.hasAnswer = true;
      run.final = true;
      run.verifiedRun = false;
      closeSteps();
      lastAsk = { question: run.question, scopeId: run.scopeId, topicId: run.topicId, answer: evt.Text,
                  mode: run.modeId, verified: false };
      showApproveForm();
    } else if (evt.Type === "answer") {
      answerEl.className = "panel";
      answerEl.innerHTML = renderAnswer(evt.Text);
      run.hasAnswer = true;
      run.final = true;
      closeSteps();
      lastAsk = { question: run.question, scopeId: run.scopeId, topicId: run.topicId, answer: evt.Text,
                  mode: run.modeId, verified: true };
      showApproveForm();
    } else if (evt.Type === "usage") {
      run.usageText = evt.Text;
      renderUsage(evt.Text);
    } else if (evt.Type === "error") {
      run.failed = true;
      if (run.hasAnswer) {
        showNotice(evt.Text);   // gelmiş cevabı silme
        const header = answerEl.querySelector(".catalog-header");
        if (!run.final && header)
          header.innerHTML = '<span class="badge stale">Taslak — doğrulanamadı</span> ' +
            'Doğrulama tamamlanamadı; bu taslak koda karşı doğrulanmadı. Kaynaklarına bakarak kontrol edin veya soruyu yeniden sorun.';
      } else {
        answerEl.className = "error";
        answerEl.textContent = evt.Text;
      }
    }
  }

  // Bir SSE yanıtını sonuna kadar okur. Bağlantı koparsa hata fırlatır; çağıran yeniden bağlanır.
  async function readStream(res, run) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (run !== currentRun) { reader.cancel().catch(() => {}); return; }
      if (done) return;
      buffer += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);
        if (!chunk.startsWith("data: ")) continue;   // ": hala-calisiyor" satırları yok sayılır
        const evt = JSON.parse(chunk.slice(6));
        if (evt.Type === "job") { run.jobId = evt.Text; saveRun(run); continue; }
        if (evt.Type === "done") { run.finished = true; continue; }
        if (typeof evt.Seq === "number" && evt.Seq >= 0) {
          if (evt.Seq < run.next) continue;   // yeniden bağlanınca tekrar gelen olay
          run.next = evt.Seq + 1;
        }
        run.events.push(evt);
        if (evt.Type === "phase") run.statusText = evt.Text + "…";
        if (!run.visible) { updateRunPill(); continue; }   // katalog açık: sakla, sonra gösterilir
        try {
          handleEvent(evt, run);
        } catch (err) {
          // Gösterim hatası bağlantı kopması sanılıp yutulmasın; görünür olsun.
          console.error(err);
          showNotice("Cevap ekranda gösterilirken bir hata oluştu: " + err.message);
        }
      }
    }
  }

  // İncelemeyi sonuna kadar izler; bağlantı koparsa artan aralıklarla yeniden bağlanır.
  async function follow(run, firstResponse) {
    let res = firstResponse;
    let failures = 0;
    while (run === currentRun) {
      if (res) {
        const before = run.next;
        try { await readStream(res, run); } catch { /* bağlantı koptu; aşağıda yeniden bağlanılır */ }
        if (run !== currentRun) return;
        if (run.finished) break;
        if (run.next > before) failures = 0;
      }
      if (!run.jobId) {
        localEvent(run, "error", "Sunucuya bağlanılamadı. Yeniden deneyin.");
        run.stopped = true;
        setRunStatus(run, false, "");
        return;
      }
      if (++failures > MAX_RECONNECTS) {
        localEvent(run, "error", "Sunucuyla bağlantı kurulamıyor. İnceleme sunucuda sürüyor olabilir: birkaç dakika sonra " +
          "sayfayı yenilerseniz sonuç burada görünür.");
        run.stopped = true;
        setRunStatus(run, false, "");
        return;
      }
      setRunStatus(run, true, `Bağlantı koptu, yeniden bağlanılıyor (${failures}/${MAX_RECONNECTS})… İnceleme sunucuda sürüyor.`);
      await sleep(Math.min(1500 * failures, 10000));
      if (run !== currentRun) return;
      res = null;
      try {
        const r = await fetch(`/api/ask/${encodeURIComponent(run.jobId)}/stream?after=${run.next}`);
        if (r.status === 404) {
          localEvent(run, "error", "İnceleme sunucuda bulunamadı (sunucu yeniden başlamış olabilir). Soruyu yeniden sorun.");
          run.stopped = true;
          forgetRun();
          setRunStatus(run, false, "");
          return;
        }
        if (r.ok && r.body) res = r;
      } catch { /* sunucuya ulaşılamadı; bir sonraki denemede tekrar */ }
    }
    if (run !== currentRun) return;
    if (run.visible) setBusy(false, runSummary(run));
    else { askBtn.disabled = false; updateRunPill(); }   // gizliyken bitti: şerit "Cevap hazır" olur
  }

  // force = true: katalog kontrolünü atla, modeli doğrudan çalıştır ("Yeniden incele" / "Hiçbiri değil").
  async function ask(force) {
    const question = questionEl.value.trim();
    if (!question) return;
    if (currentRun && !currentRun.finished && !currentRun.stopped && currentRun.jobId &&
        !confirm("Bir inceleme hâlâ sürüyor. Yeni soruyu başlatırsanız ekran önceki incelemeyi izlemeyi bırakır. Devam edilsin mi?"))
      return;
    if (force !== true && await tryCatalogFirst(question)) return;
    const mode = selectedMode();
    forgetRun();
    const run = newRun({ question, scopeId: scopeEl.value || null, topicId: topicEl.value || null,
      modeId: mode?.id || null, modeLabel: mode?.label || null });
    setBusy(true, "Kod inceleniyor… Karmaşık sorular birkaç dakika sürebilir.");

    let res;
    try {
      res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, scopeId: run.scopeId, topicId: run.topicId, mode: run.modeId }),
      });
      if (!res.ok || !res.body) throw new Error("Sunucu hatası (" + res.status + ")");
    } catch (err) {
      if (run !== currentRun) return;
      answerEl.className = "error";
      answerEl.textContent = "Bağlantı hatası: " + err.message + ". Uygulamanın çalıştığından emin olup yeniden deneyin.";
      setBusy(false, "");
      return;
    }
    await follow(run, res);
  }

  // Sayfa yenilendiyse son incelemeyi (süren ya da biten) geri getir.
  async function resumeSavedRun() {
    const saved = savedRun();
    if (!saved?.jobId) return;
    let res;
    try { res = await fetch(`/api/ask/${encodeURIComponent(saved.jobId)}/stream?after=0`); } catch { return; }
    if (!res.ok || !res.body) { forgetRun(); return; }   // süresi dolmuş veya sunucu yeniden başlamış

    questionEl.value = saved.question || "";
    if (saved.scopeId) scopeEl.value = saved.scopeId;
    if (saved.topicId) topicEl.value = saved.topicId;
    const mode = modes.find((m) => m.id === saved.mode);
    if (mode) { const radio = modesEl.querySelector(`input[name=mode][value="${CSS.escape(mode.id)}"]`); if (radio) radio.checked = true; }
    if (catalogEnabled) loadCatalog();

    const run = newRun({ question: saved.question, scopeId: saved.scopeId, topicId: saved.topicId,
      modeId: saved.mode, modeLabel: mode?.label || null });
    run.jobId = saved.jobId;
    setBusy(true, "Önceki inceleme yükleniyor…");
    await follow(run, res);
  }

  askBtn.addEventListener("click", () => ask(false));
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(false);
  });
</script>
</body>
</html>
